services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: parktrack_postgres
    restart: always
    environment:
      POSTGRES_DB: parktrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rafa123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - parktrack_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parktrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: parktrack_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:rafa123@postgres:5432/parktrack_db?schema=public"
      PORT: 3333
      NODE_ENV: production
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parktrack_network
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npm start
      "

  # Frontend (Nginx + React)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3333
    container_name: parktrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - parktrack_network

volumes:
  postgres_data:

networks:
  parktrack_network:
    driver: bridge
